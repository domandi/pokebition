<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokebition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --royal-900:#0B1140;
    --royal-800:#111A5C;
    --royal-700:#1B2470;
    --royal-600:#2A3AB8;
    --royal-500:#3C4FDC;
    --ink:#F5F7FF;
    --ink-dim:#B9C2F0;
    --hairline:rgba(245,247,255,0.16);
    --surface:rgba(245,247,255,0.05);
    --surface-hover:rgba(245,247,255,0.10);
    --focus:#8FA0FF;
    --bg-top:var(--royal-900);
    --bg-bot:#060A2A;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --royal-900:#EEF1FF;
      --royal-800:#E3E7FF;
      --ink:#0B1140;
      --ink-dim:#3B4488;
      --hairline:rgba(11,17,64,0.14);
      --surface:rgba(11,17,64,0.04);
      --surface-hover:rgba(11,17,64,0.08);
      --bg-top:#EEF1FF;
      --bg-bot:#D9DEFF;
    }
  }
  :root[data-theme="light"]{
    --royal-900:#EEF1FF;
    --royal-800:#E3E7FF;
    --ink:#0B1140;
    --ink-dim:#3B4488;
    --hairline:rgba(11,17,64,0.14);
    --surface:rgba(11,17,64,0.04);
    --surface-hover:rgba(11,17,64,0.08);
    --bg-top:#EEF1FF;
    --bg-bot:#D9DEFF;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100dvh;
    background:
      radial-gradient(60% 40% at 50% 0%, var(--royal-700) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .page{
    width:100%;
    max-width:480px;
    min-height:100dvh;
    padding:56px 24px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .avatar-wrap{
    position:relative;
    width:112px;
    height:112px;
    margin-bottom:22px;
  }
  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:conic-gradient(from 180deg, var(--royal-500), var(--royal-800), var(--royal-500));
    opacity:0.9;
  }
  .avatar{
    position:relative;
    width:112px;
    height:112px;
    border-radius:50%;
    overflow:hidden;
    background:var(--royal-700);
    display:flex;
    align-items:center;
    justify-content:center;
    border:3px solid var(--bg-top);
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-fallback{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:42px;
    color:var(--ink);
    letter-spacing:-0.03em;
  }

  h1{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:32px;
    letter-spacing:-0.03em;
    margin:0 0 40px;
    text-align:center;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:17px 20px;
    border-radius:16px;
    background:var(--surface);
    border:1px solid var(--hairline);
    color:var(--ink);
    text-decoration:none;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:16.5px;
    letter-spacing:-0.01em;
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .link-btn:hover{
    background:var(--surface-hover);
    border-color:var(--royal-500);
  }
  .link-btn:active{
    transform:scale(0.97);
  }
  .link-btn:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .icon{
    flex:0 0 auto;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .icon svg{width:100%;height:100%;}

  .label{flex:1;}

  .chevron{
    flex:0 0 auto;
    opacity:0.5;
    width:16px;
    height:16px;
  }

  .link-btn.primary{
    background:var(--royal-600);
    border-color:var(--royal-500);
  }
  .link-btn.primary:hover{
    background:var(--royal-500);
  }

  footer{
    margin-top:auto;
    padding-top:40px;
    font-size:12px;
    color:var(--ink-dim);
    text-align:center;
    letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .link-btn{transition:none;}
  }
</style>
</head>
